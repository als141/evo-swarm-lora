# eval イメージのみ再ビルドする（ドライバコード更新時用）
#   gcloud builds submit --config cloud/cloudbuild.eval-only.yaml .
substitutions:
  _REGION: us-central1
  _REPO: evo-swarm
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/eval:latest
      - -f
      - cloud/Dockerfile.eval
      - .
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/eval:latest
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 200
timeout: 3600s
