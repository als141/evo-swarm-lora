# 2 つのジョブイメージを Cloud Build でビルドして Artifact Registry へ push する。
#   gcloud builds submit --config cloud/cloudbuild.yaml .
substitutions:
  _REGION: us-central1
  _REPO: evo-swarm
steps:
  - name: gcr.io/cloud-builders/docker
    id: build-trainer
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/trainer:latest
      - -f
      - Dockerfile
      - .
  - name: gcr.io/cloud-builders/docker
    id: build-eval
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/eval:latest
      - -f
      - cloud/Dockerfile.eval
      - .
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/trainer:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/eval:latest
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 200
timeout: 3600s
